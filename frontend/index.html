<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WanderWise – Interactive Travel Itinerary Planner</title>
  <meta name="description" content="Premium interactive travel itinerary planner with live map routing, dynamic budget calculations, timeline scheduling, and AI day regeneration.">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧭</text></svg>">

  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Leaflet Map CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <!-- Application Design System CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Top Navigation Bar -->
  <div id="navbar-mount"></div>

  <!-- Page Header & Breadcrumbs -->
  <div id="header-mount"></div>

  <!-- Main Layout Grid -->
  <main class="main-layout-container">
    <div class="app-grid">
      <!-- Left Column (~65% width): Overview, Day Selector, Itinerary Timeline -->
      <section class="itinerary-main-column">
        <!-- Trip Overview Metric Cards -->
        <div id="overview-mount"></div>

        <!-- Day Selector Tabs -->
        <div id="day-selector-mount"></div>

        <!-- Timeline & Activity Cards -->
        <div id="timeline-mount"></div>
      </section>

      <!-- Right Column (~35% width): Interactive Map & Budget Utilization Summary -->
      <aside class="itinerary-sidebar-column">
        <!-- Leaflet Map Card -->
        <div class="map-card-container">
          <div class="map-card-header">
            <div class="map-card-title">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
                <line x1="8" y1="2" x2="8" y2="18"></line>
                <line x1="16" y1="6" x2="16" y2="22"></line>
              </svg>
              <span>Route & Activity Map</span>
            </div>
            <div class="map-controls-group">
              <button class="map-control-btn" id="btn-reset-map" title="Fit all activity pins in view">
                Fit Route
              </button>
            </div>
          </div>
          <div id="leaflet-map" class="leaflet-map-element"></div>
        </div>

        <!-- Dynamic Budget Summary Card -->
        <div id="budget-mount"></div>
      </aside>
    </div>
  </main>

  <!-- Modal Mount -->
  <div id="modal-mount"></div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Leaflet Map JavaScript -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Main Application Logic (ES Module) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
